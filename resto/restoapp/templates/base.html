<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retseptlar katalogi</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .navbar { background-color: #ffffff; border-bottom: 1px solid #dee2e6; }
        .navbar-brand { font-weight: bold; color: #333 !important; font-size: 1.5rem; }
        .nav-link-admin { background-color: #e2e8f0; border-radius: 8px; padding: 5px 15px !important; color: #333 !important; font-weight: 500; }
        .category-btn { border-radius: 20px; font-size: 0.9rem; padding: 5px 15px; margin-right: 5px; color: #666; border: 1px solid #dee2e6; background: #fff; text-decoration: none; text-align: left; }
        .category-btn.active { background-color: #ff4d4d; color: #fff; border-color: #ff4d4d; }
        .recipe-card { border: none; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: transform 0.2s; }
        .recipe-card:hover { transform: translateY(-3px); }
        .recipe-title { font-size: 1.1rem; font-weight: bold; color: #222; margin-top: 10px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg py-3">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">🍽️ Recipes</a>
            <div class="ms-auto">
                <a class="nav-link-admin text-decoration-none" href="/admin" target="_blank">⚙️ Admin Panel</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
